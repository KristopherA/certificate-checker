name: CertificateChecker
options:
  bundleIdPrefix: tools.certificatechecker
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "9"
targets:
  CertificateChecker:
    type: application
    platform: macOS
    sources:
      - Sources/Core
      - Sources/App
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: "Certificate Checker"
        PRODUCT_BUNDLE_IDENTIFIER: tools.certificatechecker.desktop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Certificate Checker"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Internal tool. Ad-hoc signed development build."
  certificate-checker:
    type: tool
    platform: macOS
    sources: [Sources/Core, Sources/CLI]
    settings:
      base:
        PRODUCT_NAME: certificate-checker
  CertificateCheckerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Core
      - path: Tests
        excludes: ["Fixtures/**", "*.py", "*.sh"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tools.certificatechecker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CertificateChecker:
    build: { targets: { CertificateChecker: all, certificate-checker: all } }
    test: { targets: [CertificateCheckerTests] }
