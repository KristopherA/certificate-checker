[project]
name = "certcheck-web"
version = "0.0.0"
description = "Certificate Checker Web: Linux-native certificate checks with a web UI (work in progress, milestone M6)."
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pyopenssl>=24",
  "pyyaml>=6",
  "uvicorn>=0.54",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["certcheck", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-include = ["../shared/tools/*.py", "../shared/fixtures/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S105", "S106"]  # S105/S106: synthetic test-only secrets and PFX passwords
"certcheck/offline/**" = ["E501"]
"certcheck/radius.py" = ["E501"]  # user-facing strings are ported verbatim from the Swift sources for parity
"../shared/fixtures/make_fixture_ca.py" = ["S303"]  # the sha1-signature fixture is deliberately weak

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["certcheck", "app"]
