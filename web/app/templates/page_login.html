{% extends "base.html" %}
{% block title %}Log in · Certificate Checker{% endblock %}
{% block main %}
<h1>Log in</h1>
{% if message %}<p class="sev-fail" role="alert">{{ message }}</p>{% endif %}
<form method="post" action="/login" class="login">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="text" name="username" value="certcheck" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
  <label>Password <input type="password" name="password" maxlength="1024" autocomplete="current-password" required autofocus></label>
  <div><button type="submit">Log in</button></div>
</form>
{% endblock %}
