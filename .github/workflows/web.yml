# Linux CI for Certificate Checker Web (spec section 10): ruff, mypy, pytest, gitleaks, a multi-arch buildx build
# and a Trivy scan. Nothing is pushed or published here: releases (GHCR on a web-v* tag, with approval) are separate.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "shared/**", ".gitleaks.toml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "shared/**", ".gitleaks.toml", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.8"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      # CI=true (set by GitHub) turns the catalogue drift and gitleaks-allowlist skips into failures.
      - run: uv run --frozen pytest -q -p no:cacheprovider -rs

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks 8.30.1 (repo root, .gitleaks.toml)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, verified independently; a mismatch fails the job.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 + arm64 (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          sbom: true
          provenance: mode=max
          tags: certcheck-web:ci
      - name: Load amd64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: certcheck-web:ci
      - name: Smoke test (hardened run, health, non-root)
        run: |
          set -euo pipefail
          hash=$(docker run --rm --entrypoint python certcheck-web:ci -c "from app.auth import hash_password; print(hash_password('ci-only-password-1234'))")
          docker run -d --name certcheck-ci --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -e CERTCHECK_PASSWORD_HASH="$hash" -p 127.0.0.1:8443:8080 certcheck-web:ci
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' certcheck-ci)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' certcheck-ci | grep -qx healthy
          [ "$(docker exec certcheck-ci id -u)" = 10001 ]
          curl -fsk https://127.0.0.1:8443/api/v1/health
          docker rm -f certcheck-ci
      - name: Trivy (vulnerabilities, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: certcheck-web:ci
          version: v0.76.1
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
