[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Synthetic WireGuard key lines in the Swift test fixtures (exact key lines only)"
condition = "AND"
paths = [
  '''^Tests/Fixtures/wg-bad\.conf$''',
  '''^Tests/Fixtures/wg-client\.conf$''',
  '''^Tests/Fixtures/wg-server\.conf$''',
]
regexTarget = "line"
regexes = ['''(?m)^(PrivateKey|PresharedKey) = [A-Za-z0-9+/]{43}=$''']
[[rules.allowlists]]
description = "One synthetic RADIUS test secret, exact line only"
condition = "AND"
paths = ['''^Tests/RadiusTests\.swift$''']
regexTarget = "line"
regexes = ['''(?m)^ *let r = RadiusProbe\.run\(host: "127\.0\.0\.1", expectedName: "vpn\.example\.test", secret: "SYNTH-secret-123", tool: tool\)$''']
[[rules.allowlists]]
description = "Synthetic key file names in the offline fixture index (exact \"key\" lines only)"
condition = "AND"
paths = ['''^shared/fixtures/offline/cases\.json$''']
regexTarget = "line"
regexes = ['''(?m)^ *"key": "SYNTHETIC-[A-Za-z0-9-]+\.key",?$''']

[[rules]]
id = "pkcs12-file"
[[rules.allowlists]]
description = "Throwaway PKCS#12 test bundle (this rule matches on the file name alone)"
paths = ['''^Tests/Fixtures/leaf\.p12$''']
