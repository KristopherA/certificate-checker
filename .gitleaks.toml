[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Synthetic WireGuard keys in the Swift test fixtures"
paths = [
  '''^Tests/Fixtures/wg-bad\.conf$''',
  '''^Tests/Fixtures/wg-client\.conf$''',
  '''^Tests/Fixtures/wg-server\.conf$''',
]
[[rules.allowlists]]
description = "One synthetic RADIUS test secret, exact line only"
condition = "AND"
paths = ['''^Tests/RadiusTests\.swift$''']
regexTarget = "line"
regexes = ['''secret: "SYNTH-secret-123", tool: tool\)''']

[[rules]]
id = "pkcs12-file"
[[rules.allowlists]]
description = "Throwaway PKCS#12 test bundle (this rule matches on the file name alone)"
paths = ['''^Tests/Fixtures/leaf\.p12$''']
