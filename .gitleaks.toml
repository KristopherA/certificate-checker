# certificate-checker gitleaks config (gitleaks >= 8.28).
#
# CI must run gitleaks from the repository root (`gitleaks dir .` or `gitleaks git .` with the root as
# the working directory): every allowlist path below is anchored to the root (^Tests/..., ^shared/...),
# so a scan started anywhere else matches none of them and the fixtures are reported.
#
# Nothing is exempt from every rule. Each allowlist sits inside the one rule it silences: a [[rules]]
# entry with a default rule's id inherits that rule's regex and only adds the allowlist. Each names
# exact files (anchored, one per file), so any other secret in those files, and any new file, is
# still reported. The private-key list is generated by shared/tools/gitleaks_allowlist.py --write;
# the web test suite runs --check, so a fixture added, renamed or removed without updating the list
# fails CI. ([[allowlists]] with targetRules is not used: gitleaks 8.28 does not apply it to rules
# pulled in by [extend] useDefault, so such an allowlist silently matches nothing.)

title = "certificate-checker gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "private-key"
[[rules.allowlists]]
description = "Throwaway private keys for example domains: Swift test fixtures and the shared fixture CA"
paths = [
