# Web-only findings (M4: revocation, legacy TLS, AIA, CT). Hand-maintained: the Swift app has no equivalent,
# so these are not in the generated findings.yaml. Ids must not collide with findings.yaml (tests/test_catalogue.py).
schema: 1
count: 14
findings:
  - id: "rev-{i}"
    severity: "fail"
    topic: "trust"
    kind: "revocation"
    title: "Certificate {i} ({name}) is REVOKED"
    detail: "Revoked{ on date}{, reason}; answer from {method}. Replace the certificate."
    source: "web/certcheck"
    mac_only: false
  - id: "rev-{i}"
    severity: "pass"
    topic: "trust"
    kind: "revocation"
    title: "Certificate {i} ({name}) is not revoked"
    detail: "Answer from {method} (stapled OCSP, OCSP or CRL)."
    source: "web/certcheck"
    mac_only: false
  - id: "rev-{i}"
    severity: "info"
    topic: "trust"
    kind: "revocation"
    title: "Certificate {i} ({name}): revocation not applicable"
    detail: "{reason} (self-signed: nothing can revoke it)."
    source: "web/certcheck"
    mac_only: false
  - id: "rev-{i}"
    severity: "info"
    topic: "trust"
    kind: "revocation"
    title: "Certificate {i} ({name}): revocation COULD NOT CHECK"
    detail: "{reason}: every step (stapled OCSP, OCSP, CRL) failed, was blocked by the target policy, or none exists."
    source: "web/certcheck"
    mac_only: false
  - id: "must-staple"
    severity: "warning"
    topic: "trust"
    kind: "revocation"
    title: "Must-staple certificate, but the server did not staple an OCSP response"
    detail: "Browsers that honour must-staple refuse this server. Enable OCSP stapling on the server."
    source: "web/certcheck"
    mac_only: false
  - id: "rev-urls"
    severity: "info"
    topic: "trust"
    kind: "revocation"
    title: "Revocation: URLs contacted"
    detail: "{urls}"
    source: "web/certcheck"
    mac_only: false
  - id: "legacy-{version}"
    severity: "fail"
    topic: "general"
    kind: "legacy"
    title: "INSECURE: server accepts {version}"
    detail: "Ciphers accepted: {ciphers}. {FIX}"
    source: "web/certcheck"
    mac_only: false
  - id: "legacy-none"
    severity: "pass"
    topic: "general"
    kind: "legacy"
    title: "Server refuses TLS 1.0 and 1.1"
    detail: ""
    source: "web/certcheck"
    mac_only: false
  - id: "legacy-mode"
    severity: "info"
    topic: "general"
    kind: "legacy"
    title: "Result from legacy mode (TLS 1.0/1.1)"
    detail: "The normal probe (TLS 1.2+) failed: {error}"
    source: "web/certcheck"
    mac_only: false
  - id: "legacy-hint"
    severity: "info"
    topic: "connection"
    kind: "legacy"
    title: "The server may offer only TLS 1.0/1.1"
    detail: "The handshake failed on protocol version or ciphers. Run the check again with legacy mode to see what the server accepts."
    source: "web/certcheck"
    mac_only: false
  - id: "aia-fetched"
    severity: "warning"
    topic: "chainIncomplete"
    kind: "aia"
    title: "Missing intermediate fetched via AIA"
    detail: "{names} fetched from {urls}. The server should send the intermediate itself; clients without AIA fetching fail."
    source: "web/certcheck"
    mac_only: false
  - id: "aia-none"
    severity: "info"
    topic: "chainIncomplete"
    kind: "aia"
    title: "AIA: nothing fetched"
    detail: "{notes}"
    source: "web/certcheck"
    mac_only: false
  - id: "ct-sct"
    severity: "info"
    topic: "trust"
    kind: "ct"
    title: "Certificate Transparency: {n} embedded SCT(s)"
    detail: "Counts SCTs embedded in the leaf certificate only (not TLS-extension or OCSP SCTs); presence only, signatures are not verified."
    source: "web/certcheck"
    mac_only: false
  - id: "ct-sct"
    severity: "info"
    topic: "trust"
    kind: "ct"
    title: "Certificate Transparency: no embedded SCTs"
    detail: "Public CAs embed SCTs; a private CA usually does not."
    source: "web/certcheck"
    mac_only: false
