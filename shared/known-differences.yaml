# Known, accepted differences between the Mac app (SecTrust) and Certificate Checker Web (OpenSSL).
# web/tests/test_parity.py fails on any difference NOT listed here, and on any entry here that no
# longer occurs, so this file always describes the real state.
#
# Parity compares finding id, severity and topic (titles and details are free text), plus the
# fixture-anchored trust verdict (golden `trust_fixture_anchor.trusted`).
schema: 1

fixture_differences:
  - case: ca-as-leaf
    check: trust_fixture_anchor
    mac: true
    web: false
    reason: >-
      OpenSSL's sslserver purpose with -x509_strict rejects a leaf with Basic Constraints CA:TRUE
      ("unsuitable certificate purpose"); SecTrust's SSL policy accepts it. Both still report the
      ca-leaf warning, so the user sees the problem either way. Web is deliberately the stricter of
      the two and stays so: a CA:TRUE certificate presented as a server leaf is a misissuance.
  - case: any-eku-only
    check: findings
    mac: [["eku", "pass", "eku"]]
    web: [["eku", "fail", "eku"]]
    reason: >-
      Leaf whose only EKU is anyExtendedKeyUsage. The Mac's eku check accepts it; SecTrust still
      rejects it for SSL, so both sides report trust fail. Web picks the stricter behaviour in both
      places: analysis fails the eku check and trust.tls_policy rejects it (and rule 4 of the downgrade rule
      below means it is never softened).


# Service adjusters (shared/fixtures/adjust, goldens in shared/golden/adjust; web/tests/test_adjust_parity.py).
# The web downgrade rule (certcheck.adjust.may_downgrade) softens a trust failure only when ALL four hold:
#   1. in date: every presented certificate is inside its validity dates;
#   2. signature verifies: each certificate is signed by the next, and the top one is self-signed with a valid
#      self-signature or is (signed by) a supplied anchor; a top certificate whose issuer was not sent never counts;
#   3. DNS SAN covers the host: never the Common Name, never for an IP address;
#   4. never on EKU failure: no eku finding failed.
# The Mac needs only 1 and 2 (and its check 2 accepts a leaf sent alone, see forged-*), so these cases stay "fail".
adjust_differences:
  - case: hp-default
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: hp-hpinc
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: hp-ljname
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: retrospect-default
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: rdp-nosan
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: rdp-clientauth
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      The leaf's EKU is clientAuth only, so the eku check fails. The Mac's Remote adjuster still downgrades the
      self-signed trust failure; web never downgrades on an EKU failure.
  - case: forged-synology
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      Forged issuer (review B1): a leaf for the host whose issuer NAME is Synology's factory CA, signed by an
      unrelated key and sent alone. The Mac's ChainCheck.verify anchors on the last presented certificate, so a
      lone leaf "verifies" against itself and the DSM adjuster downgrades the trust failure. Web requires the top
      certificate to be self-signed or to chain to a supplied anchor (rule 2), so the failure stands. This is a
      Mac bug, to be fixed separately in Swift; this entry must then be deleted.
  - case: forged-pve
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      Forged issuer (review B1): as forged-synology, with the Proxmox VE cluster-CA issuer name on a leaf for
      the host and no fingerprint pin. The Mac's PVE adjuster downgrades; web keeps the failure (rule 2).

# Differences that the fixture cases do not exercise. Documented, not tested.
# Offline checks and RADIUS (shared/fixtures/offline/cases.json, goldens in shared/golden/offline;
# web/tests/test_offline_parity.py). Same rule: every listed difference must still occur.
offline_differences:
  - case: rad-top-not-sent
    mac: [["rad-chain", "pass", "radius"]]
    web: [["rad-chain", "fail", "radius"]]
    reason: >-
      KNOWN MAC BUG (Radius.swift:92-93, via ChainCheck.swift:28-40). The server sends leaf + intermediate
      but not the root. ChainCheck passes the top certificate to SecTrust as its own anchor and never checks
      its self-signature, so the Mac reports "Chain verifies to Test Rollover CA" (a false PASS). Web
      (chaincheck.verify) requires the top to be self-issued with a valid self-signature, or to be or be
      signed by a supplied anchor, and fails otherwise. To be fixed on the Mac in 0.10.1.
  - case: rad-bad
    mac: [["rad-chain", "pass", "radius"]]
    web: [["rad-chain", "fail", "radius"]]
    reason: >-
      Same Mac bug. ipsec-bad.crt names Test IKEv2 CA as issuer but is not signed by it; the Mac's chain
      builder drops the CA and anchors the lone leaf as itself, so it "verifies". Web reports the failed
      signature link.
  - case: ipsec-top-not-sent
    mac: [["srv0-chain", "pass", "ipsec"]]
    web: [["srv0-chain", "fail", "ipsec"]]
    reason: Same Mac bug, in IPsec.swift srvN-chain (shared ChainCheck.verify).
  - case: ipsec-bad
    mac: [["srv0-chain", "pass", "ipsec"]]
    web: [["srv0-chain", "fail", "ipsec"]]
    reason: Same Mac bug as rad-bad, in IPsec.swift srvN-chain.
  - case: munki-plist-only
    mac:
      - ["mtls-none", "fail", "vendor"]
      - ["read-ca.pem", "fail", "vendor"]
      - ["read-client.key", "fail", "vendor"]
      - ["read-client.pem", "fail", "vendor"]
    web: [["munki-pair", "info", "vendor"]]
    reason: >-
      With only ManagedInstalls.plist given, the Mac falls back to the ClientCertificatePath,
      ClientKeyPath and SoftwareRepoCACertificate paths named inside it and reads them from the local
      disk (here they do not exist, so read-* fail). Web never opens a path taken from an uploaded file:
      it reads uploads only and says (munki-pair, info) that the certificate, key and CA must be uploaded.

general:
  - topic: trust
    text: >-
      The "trust" finding uses the platform store: the macOS keychain on the Mac, ca-certificates
      (OpenSSL default store) in the container. Internal CAs must be mounted into /config/ca/ for web.
      Titles say "Not trusted by macOS (...)" on the Mac and "Not trusted (...)" on web.
  - topic: trust
    text: >-
      OpenSSL does not apply Apple's rules itself, so web adds them as explicit policy (trust.tls_policy):
      SAN required for hostname checks, an EKU extension required, at most 825 days for TLS server
      certificates, and auth level 2 (no SHA-1, RSA >= 2048). Apple's CT requirement for publicly
      trusted certificates is not enforced; CT is reported as SCT presence only (M4). The 825-day
      limit applies only to certificates issued on or after 2019-07-01, as Apple's rule does.
  - topic: trust
    text: >-
      With a hostname, web requires a DNS SAN that covers it (an IP SAN for an IP address); the
      Common Name is never used. Fixtures ip-only-san-cn-host and email-only-san-cn-host cover this.
  - topic: trust
    text: >-
      Web needs OpenSSL 3 or newer (its version, never the binary path, is shown in trust finding details). The
      container pins /usr/bin/openssl; Mac runs use Homebrew (currently 4.0.2). Goldens are checked
      here against whichever OpenSSL runs the tests; CI parity must run on the pinned container
      OpenSSL (M7).
  - topic: connection
    text: >-
      Web probe target policy (probe.TargetPolicy, env-configurable) denies by default: cloud
      metadata (169.254.169.254, 169.254.170.2, fd00:ec2::254 and the Alibaba Cloud metadata address in
      the CGNAT range), link-local, loopback, unspecified, 0.0.0.0/8 and multicast, and the app's own
      port (CERTCHECK_PORT, default 8080) on loopback, unspecified and the container's own
      addresses (any other host may be probed on that port, per the spec). IPv6 forms that embed an
      IPv4 address are judged as that address: IPv4-mapped ::ffff:a.b.c.d, NAT64 64:ff9b::/96, 6to4
      2002::/16, IPv4-compatible ::a.b.c.d, and Teredo 2001::/32 (both the server and the client
      address). CERTCHECK_PROBE_ALLOW_LOOPBACK / _ALLOW_LINK_LOCAL /
      _ALLOW_METADATA=1 opt in; CERTCHECK_PROBE_DENY adds CIDRs. An invalid CERTCHECK_PORT or
      CIDR fails closed (no probe runs). Private ranges are allowed (internal servers are the use
      case). Name lookups time out after 5 s and at most 4 run at once; a hung lookup keeps its
      slot until it really returns, and further lookups fail fast with "resolver busy". Each
      resolved address is tried once in order; an IPv4/IPv6-only choice is available. The Mac
      app has no such policy.
  - topic: trust
    text: >-
      SecTrust may fetch missing intermediates (AIA) for live probes on its own; web does so only with
      the AIA option (certcheck.check, off by default, M4): at most 3 caIssuers fetches, each through
      TargetPolicy, and a fetched certificate is kept only if its subject and signature match; roots are
      never added. Without the option, a server that omits an intermediate can be trusted on the Mac but
      not on web; with it web reports aia-fetched (warning), which the Mac has no equivalent of.
  - topic: connection
    text: >-
      The Mac reports the TLS version as "TLS 1.2"; web uses Python's names ("TLSv1.2"), except in
      vendor finding text, which uses the Mac names. Split-DNS (split-dns): the Mac compares against
      the scutil resolver configuration; web compares the resolved addresses against the nameservers in
      /etc/resolv.conf (internal nameserver, all-public answers) and names `dig @ns` vs `getent hosts`.
      Web cannot see iCloud Private Relay itself, so there is no private-relay finding; the split-dns
      detail mentions it for a Docker Desktop host on a Mac. The firewall hint has the same id, text and
      trigger on both.
  - topic: connection
    text: >-
      STARTTLS/upgrade dialogues (SMTP, IMAP, POP3, LDAP, MySQL SSLRequest, RDP X.224) send the same
      bytes and report the same messages as the Mac. Web caps a server reply line at 64 KB (the Mac
      has no cap) and reports a longer line as a protocol failure.
  - topic: trust
    text: >-
      Trust titles after a Remote-adjuster re-evaluation say "Chain trusted (X.509 policy)" / "Not
      trusted (X.509 policy)" on web, without "by macOS". Pin matching (Proxmox) and the supplied-CA
      comparison (Stack) downgrade only under the same strict rule as every other downgrade (the four
      rules at the top of adjust_differences); a pin match never bypasses them.
  - topic: general
    text: >-
      Deferred from M2: the Docker registry /v2/ API probe and WinRM HTTP (5985) opt-in checks. The Guidance
      text arrived in M5 (certcheck.guidance, a port of Guidance.swift): generic, IIS, Apache, nginx,
      Synology, Proxmox VE/PBS, Munki and STARTTLS steps match the Mac; the RDP, RD Gateway, WinRM, Docker
      registry, Elastic Stack, FileMaker, Retrospect, HP printer and Barracuda platforms fall back to the
      generic "reissue and redeploy" steps, and the Mac's knowledge-base links are omitted.
  - topic: general
    text: >-
      PKCS#7 bundles and PFX/P12 files are read in M3. PFX passwords are used in memory only and are never
      echoed in findings or logs; a wrong password reports "could not be decrypted" without the value.
  - topic: general
    text: >-
      M4 web-only options (all off by default, per check or per target): revocation, legacy TLS 1.0/1.1
      and AIA. Their findings (rev-*, must-staple, rev-urls, legacy-*, aia-*, ct-sct) are catalogued in
      shared/web-findings.yaml, not findings.yaml, and are added only by the live-probe orchestrator
      (certcheck.check), so the parity goldens are unaffected.
  - topic: general
    text: >-
      Revocation (web only) runs stapled OCSP, then OCSP, then CRL per certificate and stops at the first
      verified answer; otherwise it reports COULD NOT CHECK with the reason (self-signed: not applicable).
      Python's ssl module cannot read a stapled OCSP response, so web opens one extra pyOpenSSL
      connection (TLS 1.2+, no certificate verification, OCSP status request) to the same address the probe
      used. OCSP, CRL and AIA URLs are outbound requests: http/https only, no userinfo, TargetPolicy on every
      hop, at most 3 redirects, 5 s per fetch, and 256 KB (AIA), 64 KB (OCSP) or 10 MB (CRL); every URL
      contacted is listed (rev-urls, ProbeResult.contacted); a URL refused by TargetPolicy is listed
      separately as blocked (ProbeResult.blocked), never as contacted. Partitioned and indirect CRLs are
      refused, and so is a CRL whose IDP scope does not cover the certificate (onlyContainsCACerts for an
      end-entity certificate, onlyContainsUserCerts for a CA): that CRL is unusable, never GOOD.
  - topic: general
    text: >-
      Legacy mode (web only) uses a fresh SSLContext per connection, pinned to TLS 1.0 or 1.1 at
      SECLEVEL=0; the default probe context and the app's listener stay TLS 1.2+. A server that accepts
      either version gets an INSECURE legacy-TLSv1 / legacy-TLSv1.1 fail listing its ciphers; a result
      that needed legacy mode is badged (ProbeResult.legacy, legacy-mode). Without legacy mode a
      version/cipher handshake failure adds legacy-hint. The Mac app cannot connect to such servers.
  - topic: general
    text: >-
      CT (ct-sct, web only) counts SCTs embedded in the leaf; SCTs delivered in the TLS extension or in OCSP
      are not counted and SCT signatures are not verified.
  - topic: chain
    text: >-
      chaincheck.verify (RADIUS, IPsec, mTLS) is offline and stricter than the Mac's ChainCheck: the top
      certificate must be anchored (see offline_differences), and pathLenConstraint is enforced as SecTrust
      does. Revocation is not checked by either side (ipsec-revocation info). A certificate with a
      malformed basicConstraints is a parse failure on web (cryptography refuses it), so the Mac's
      chain-bcbad-k finding has no web equivalent.
  - topic: radius
    text: >-
      The live RADIUS probe runs eapol_test with the same anonymous configuration as the Mac. The target goes
      through the same TargetPolicy as the TCP probe (resolved on the shared resolver pool with a 5 s timeout,
      every resolved address checked; loopback, link-local/metadata, unspecified and multicast refused as
      rad-probe-input), and only the first allowed address is given to eapol_test. eapol_test is killed in a
      finally block on any exception. SECRET IN ARGV: hostap's eapol_test takes the shared secret only from
      -s (eapol_test.c getopt "a:A:c:C:ei:j:J:k:K:M:nN:o:p:P:r:R:s:St:T:vWX:", as_secret = optarg at ~1433;
      default "radius", or "radsec" for RadSec, at ~1496); there is no config-file, environment or stdin
      option. So for the few seconds a probe runs, the secret is readable in /proc/PID/cmdline by processes
      that can see that PID (same as the Mac). Mitigation (least invasive, no hostap patch): run web in its
      own container with its own PID namespace (never --pid=host, never a shared PID namespace with other
      containers), as a dedicated non-root user, with nothing else in the container; the remaining exposure
      is other processes inside that container and root on the Docker host (who can read the app's memory
      anyway). On a shared non-container host, mount /proc with hidepid=2 or use a dedicated host. The secret
      is redacted from the transcript and never logged or stored. CHAIN ORDER (confirmed in hostap source and
      by the live run, test_radius_live.py::test_eapol_test_o_order_is_top_first): eapol_test -o writes one
      PEM per OpenSSL verify-callback call (eapol_test_cert_cb from tls_openssl.c tls_verify_cb), i.e. the
      path OpenSSL built, top (deepest) first down to the leaf; not the order the server sent, extra
      certificates the server sent that are not on that path are absent, and a certificate can repeat
      (depth 0 is re-emitted when a CA-level check fails, tls_openssl.c ~2937-2953). KNOWN MAC BUG:
      Radius.swift:211 assumes leaf-first, so against a real FreeRADIUS the Mac would report rad-order plus
      rad-isca / rad-notca / rad-unlinked / rad-name failures for a correct server (inferred: web produced
      exactly this with the Mac's assumption in the M3 live run). Web de-duplicates, orders the chain
      leaf-first by issuer links and does not report rad-order for the probe, because the wire order is not
      visible in that file. XML (pfSense config.xml) uploads with any DTD are refused at the expat level
      (also UTF-16), nesting deeper than 1000 levels is refused, and any RecursionError fails closed. Munki
      plists with any ENTITY, or any DOCTYPE other than Apple's standard plist DOCTYPE, are refused, in any encoding (UTF-8 BOM, UTF-16/32 with or without a BOM, checked on the decoded text and
      again at the expat level) (the
      standard one is in every real ManagedInstalls.plist and the Mac fixtures, so refusing it would refuse
      every file). PFX/P12: PKCS#12 PBE, PBKDF2 and MAC iteration counts are read from the ASN.1 before
      anything is decrypted and refused above 1,000,000 (bags inside encrypted SafeContents are only visible
      after decryption, so decryption runs in a separate worker process killed after 10 s, PFX_TIME_BUDGET_S;
      the password reaches it over stdin only); a
      damaged file is reported separately from a wrong password when the MAC verifies with the given
      password or the file does not parse as PKCS#12.
  - topic: general
    text: >-
      M5 web UI and REST API (FastAPI, server-rendered Jinja2, vendored htmx 2.0.11; no JS build). Auth,
      TLS for the UI, LAN bind, rate limits and settings.yaml are M6: until then the app binds 127.0.0.1
      over plain HTTP (CERTCHECK_BIND to change), only a concurrency cap (CERTCHECK_MAX_CONCURRENT, 429
      beyond it) limits load, and the CSRF cookie is not Secure unless CERTCHECK_SECURE_COOKIES is set.
      Every route is hardened as if reachable by anyone on the LAN: strict CSP (default-src 'none',
      script-src 'self', no inline script or style, no eval in htmx), double-submit CSRF tokens on all UI
      forms, Origin and Sec-Fetch-Site checks on every unsafe request, API POSTs need a JSON body or the
      X-CertCheck-Request header (both force a CORS preflight), an optional Host allowlist
      (CERTCHECK_ALLOWED_HOSTS) against DNS rebinding, autoescaped output everywhere, and a 1 MB cap on the
      whole request body, buffered in memory (stricter than filecheck's 2 MB per file); uploads are never
      written to disk. Fix guidance is copy-only text; the app never runs it. Exports are data: links, so
      no result is stored on the server. CERTCHECK_ANCHORS (a PEM bundle) replaces the trust store; the
      /config/ca directory from the spec is not wired yet. Swagger/ReDoc pages are disabled (they need a
      CDN and inline script); the OpenAPI document at /api/v1/openapi.json is public by design (it only
      describes the API and holds no data or secrets; M6 auth will decide whether it stays public). There is
      no Referer fallback when Origin is missing: the request is refused when Sec-Fetch-Site is cross-site
      or same-site, or when Origin is present and is not this origin; a request with neither header (curl,
      scripts) passes this check and still needs the CSRF token (UI forms) or the JSON body /
      X-CertCheck-Request header (API). Browsers that send neither are not supported.
