# Known, accepted differences between the Mac app (SecTrust) and Certificate Checker Web (OpenSSL).
# web/tests/test_parity.py fails on any difference NOT listed here, and on any entry here that no
# longer occurs, so this file always describes the real state.
#
# Parity compares finding id, severity and topic (titles and details are free text), plus the
# fixture-anchored trust verdict (golden `trust_fixture_anchor.trusted`).
schema: 1

fixture_differences:
  - case: ca-as-leaf
    check: trust_fixture_anchor
    mac: true
    web: false
    reason: >-
      OpenSSL's sslserver purpose with -x509_strict rejects a leaf with Basic Constraints CA:TRUE
      ("unsuitable certificate purpose"); SecTrust's SSL policy accepts it. Both still report the
      ca-leaf warning, so the user sees the problem either way. Web is deliberately the stricter of
      the two and stays so: a CA:TRUE certificate presented as a server leaf is a misissuance.
  - case: any-eku-only
    check: findings
    mac: [["eku", "pass", "eku"]]
    web: [["eku", "fail", "eku"]]
    reason: >-
      Leaf whose only EKU is anyExtendedKeyUsage. The Mac's eku check accepts it; SecTrust still
      rejects it for SSL, so both sides report trust fail. Web picks the stricter behaviour in both
      places: analysis fails the eku check and trust.tls_policy rejects it (and rule 4 of the downgrade rule
      below means it is never softened).


# Service adjusters (shared/fixtures/adjust, goldens in shared/golden/adjust; web/tests/test_adjust_parity.py).
# The web downgrade rule (certcheck.adjust.may_downgrade) softens a trust failure only when ALL four hold:
#   1. in date: every presented certificate is inside its validity dates;
#   2. signature verifies: each certificate is signed by the next, and the top one is self-signed with a valid
#      self-signature or is (signed by) a supplied anchor; a top certificate whose issuer was not sent never counts;
#   3. DNS SAN covers the host: never the Common Name, never for an IP address;
#   4. never on EKU failure: no eku finding failed.
# The Mac needs only 1 and 2 (and its check 2 accepts a leaf sent alone, see forged-*), so these cases stay "fail".
adjust_differences:
  - case: hp-default
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: hp-hpinc
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: hp-ljname
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: retrospect-default
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: rdp-nosan
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      No DNS SAN covers the host (vendor default with only a Common Name). The Mac downgrades an untrusted
      in-date, correctly signed self-signed certificate to a warning; web downgrades only when a DNS SAN also covers
      the host, so the trust failure stands (the M2 downgrade rule).
  - case: rdp-clientauth
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      The leaf's EKU is clientAuth only, so the eku check fails. The Mac's Remote adjuster still downgrades the
      self-signed trust failure; web never downgrades on an EKU failure.
  - case: forged-synology
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      Forged issuer (review B1): a leaf for the host whose issuer NAME is Synology's factory CA, signed by an
      unrelated key and sent alone. The Mac's ChainCheck.verify anchors on the last presented certificate, so a
      lone leaf "verifies" against itself and the DSM adjuster downgrades the trust failure. Web requires the top
      certificate to be self-signed or to chain to a supplied anchor (rule 2), so the failure stands. This is a
      Mac bug, to be fixed separately in Swift; this entry must then be deleted.
  - case: forged-pve
    mac: [["trust", "warning", "trust"]]
    web: [["trust", "fail", "trust"]]
    reason: >-
      Forged issuer (review B1): as forged-synology, with the Proxmox VE cluster-CA issuer name on a leaf for
      the host and no fingerprint pin. The Mac's PVE adjuster downgrades; web keeps the failure (rule 2).

# Differences that the fixture cases do not exercise. Documented, not tested.
general:
  - topic: trust
    text: >-
      The "trust" finding uses the platform store: the macOS keychain on the Mac, ca-certificates
      (OpenSSL default store) in the container. Internal CAs must be mounted into /config/ca/ for web.
      Titles say "Not trusted by macOS (...)" on the Mac and "Not trusted (...)" on web.
  - topic: trust
    text: >-
      OpenSSL does not apply Apple's rules itself, so web adds them as explicit policy (trust.tls_policy):
      SAN required for hostname checks, an EKU extension required, at most 825 days for TLS server
      certificates, and auth level 2 (no SHA-1, RSA >= 2048). Apple's CT requirement for publicly
      trusted certificates is not enforced; CT is reported as SCT presence only (M4). The 825-day
      limit applies only to certificates issued on or after 2019-07-01, as Apple's rule does.
  - topic: trust
    text: >-
      With a hostname, web requires a DNS SAN that covers it (an IP SAN for an IP address); the
      Common Name is never used. Fixtures ip-only-san-cn-host and email-only-san-cn-host cover this.
  - topic: trust
    text: >-
      Web needs OpenSSL 3 or newer (its version, never the binary path, is shown in trust finding details). The
      container pins /usr/bin/openssl; Mac runs use Homebrew (currently 4.0.2). Goldens are checked
      here against whichever OpenSSL runs the tests; CI parity must run on the pinned container
      OpenSSL (M7).
  - topic: connection
    text: >-
      Web probe target policy (probe.TargetPolicy, env-configurable) denies by default: cloud
      metadata (169.254.169.254, 169.254.170.2, fd00:ec2::254 and the Alibaba Cloud metadata address in
      the CGNAT range), link-local, loopback, unspecified, 0.0.0.0/8 and multicast, and the app's own
      port (CERTCHECK_PORT, default 8080) on loopback, unspecified and the container's own
      addresses (any other host may be probed on that port, per the spec). IPv6 forms that embed an
      IPv4 address are judged as that address: IPv4-mapped ::ffff:a.b.c.d, NAT64 64:ff9b::/96, 6to4
      2002::/16, IPv4-compatible ::a.b.c.d, and Teredo 2001::/32 (both the server and the client
      address). CERTCHECK_PROBE_ALLOW_LOOPBACK / _ALLOW_LINK_LOCAL /
      _ALLOW_METADATA=1 opt in; CERTCHECK_PROBE_DENY adds CIDRs. An invalid CERTCHECK_PORT or
      CIDR fails closed (no probe runs). Private ranges are allowed (internal servers are the use
      case). Name lookups time out after 5 s and at most 4 run at once; a hung lookup keeps its
      slot until it really returns, and further lookups fail fast with "resolver busy". Each
      resolved address is tried once in order; an IPv4/IPv6-only choice is available. The Mac
      app has no such policy.
  - topic: trust
    text: >-
      SecTrust may fetch missing intermediates (AIA) for live probes; web never does in M1
      (AIA fetch is optional and off by default, M4). A server that omits an intermediate can
      therefore be trusted on the Mac but not on web.
  - topic: connection
    text: >-
      The Mac reports the TLS version as "TLS 1.2"; web uses Python's names ("TLSv1.2"), except in
      vendor finding text, which uses the Mac names. Split-DNS (split-dns): the Mac compares against
      the scutil resolver configuration; web compares the resolved addresses against the nameservers in
      /etc/resolv.conf (internal nameserver, all-public answers) and names `dig @ns` vs `getent hosts`.
      Web cannot see iCloud Private Relay itself, so there is no private-relay finding; the split-dns
      detail mentions it for a Docker Desktop host on a Mac. The firewall hint has the same id, text and
      trigger on both.
  - topic: connection
    text: >-
      STARTTLS/upgrade dialogues (SMTP, IMAP, POP3, LDAP, MySQL SSLRequest, RDP X.224) send the same
      bytes and report the same messages as the Mac. Web caps a server reply line at 64 KB (the Mac
      has no cap) and reports a longer line as a protocol failure.
  - topic: trust
    text: >-
      Trust titles after a Remote-adjuster re-evaluation say "Chain trusted (X.509 policy)" / "Not
      trusted (X.509 policy)" on web, without "by macOS". Pin matching (Proxmox) and the supplied-CA
      comparison (Stack) downgrade only under the same strict rule as every other downgrade (the four
      rules at the top of adjust_differences); a pin match never bypasses them.
  - topic: general
    text: >-
      Deferred from M2: the Docker registry /v2/ API probe and WinRM HTTP (5985) opt-in checks, and the
      per-service Guidance text shown in the Mac app.
  - topic: general
    text: >-
      PKCS#7 bundles and PFX/P12 files are not read by web in M1 (M3, offline checks).
